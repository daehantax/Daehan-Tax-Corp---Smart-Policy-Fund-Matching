# main 브랜치에 푸시될 때마다 사이트를 빌드해서 GitHub Pages로 자동 배포합니다.
# 최초 1회, 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정해야 합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 매칭 회귀 테스트. 동기화로 갱신된 공고 데이터(public/data)까지 함께 검증하므로,
      # 새 데이터가 매칭 불변식을 깨면 배포를 막고 알림이 온다.
      - run: npm test

      # 커스텀 도메인(fund.daehantax.com)을 쓰므로 base 경로 지정이 필요 없습니다.
      # (vite.config.ts 참고 — 예전 GITHUB_PAGES 환경변수는 그래서 제거했습니다)
      - run: npm run build
        env:
          # 수파베이스 연결 정보 (미설정 시 공고 데이터는 CSV 폴백. 고객사 조회는 폴백 없음)
          # anon 키는 공개 가능한 키지만 관리 일관성을 위해 Secrets로 등록
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
